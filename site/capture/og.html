<!doctype html>
<!-- The Open Graph card, 1200×630. `npm run og` screenshots it to public/og.jpg. Not deployed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="../public/tokens.css">
<link rel="stylesheet" href="../public/glass.css">
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("../public/fonts/inter-latin-wght-normal.woff2") format("woff2"); }
html, body, p { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; color-scheme: dark; font-family: "Inter", system-ui, sans-serif; font-feature-settings: "cv11", "ss03"; -webkit-font-smoothing: antialiased; color: #f5f5f7; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: linear-gradient(150deg, #4a2342 0%, #1c1226 48%, #0f0f11 100%); }
.glow { position: absolute; right: -160px; top: -60px; width: 820px; height: 760px; filter: blur(70px); opacity: 0.9;
  background: radial-gradient(38% 30% at 40% 30%, #ff6a55, transparent 70%), radial-gradient(40% 34% at 70% 45%, #c3338e, transparent 72%), radial-gradient(55% 45% at 45% 75%, #3b2477, transparent 75%); }
.copy { position: absolute; left: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; width: 600px; }
.brand { display: flex; align-items: center; gap: 22px; font-size: 72px; line-height: 1; font-weight: 800; letter-spacing: -0.035em; }
.brand svg { width: 92px; height: 92px; flex: none; }
.line { font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; color: rgb(245 240 248 / 0.9); }
.sub { font-size: 22px; line-height: 1.4; color: rgb(235 235 245 / 0.72); }
.phone { position: absolute; right: 90px; top: 70px; width: 360px; height: 640px; border-radius: 48px; background: #0f0f11; overflow: hidden;
  box-shadow: 0 0 0 1px rgb(255 255 255 / 0.14), 0 0 0 8px #1b1b20, 0 0 0 9px rgb(255 255 255 / 0.12), 0 40px 80px -20px rgb(0 0 0 / 0.7); }
.phone .ambient { z-index: 0; }
.in { position: relative; z-index: 1; padding: 22px 18px; display: grid; gap: 16px; }
.head { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
.tag { padding: 2px 8px; border-radius: 999px; background: rgb(255 255 255 / 0.12); font-size: 11px; letter-spacing: 0.14em; }
.artw { width: 260px; height: 260px; margin: 6px auto 0; border-radius: 22px; box-shadow: 0 28px 60px -20px rgb(0 0 0 / 0.75); }
.t { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.a { font-size: 17px; color: rgb(235 235 245 / 0.74); }
.reacts { display: flex; justify-content: space-between; font-size: 24px; padding: 4px 6px 0; }
.rows { display: grid; gap: 12px; padding-top: 10px; }
.r { display: flex; align-items: center; gap: 12px; }
.r .thumb { width: 48px; height: 48px; border-radius: 10px; }
.r b { display: block; font-size: 15px; font-weight: 550; }
.r small { font-size: 13px; color: rgb(235 235 245 / 0.74); }
.chip { position: absolute; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 44px; line-height: 1; filter: drop-shadow(0 6px 12px rgb(0 0 0 / 0.35)); }
.chip span { font-size: 13px; line-height: 18px; font-weight: 600; padding: 0 8px; border-radius: 999px; background: rgb(15 15 17 / 0.86); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.16); }
.c1 { right: 330px; top: 190px; }
.c2 { right: 150px; top: 120px; }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="100 100 824 824" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2342"/><stop offset="1" stop-color="#1c1226"/></linearGradient>
          <linearGradient id="jam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6d5e"/><stop offset="1" stop-color="#c41e2d"/></linearGradient>
          <clipPath id="clip"><rect x="314" y="344" width="396" height="436" rx="92"/></clipPath>
        </defs>
        <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" stroke="rgb(255 255 255 / 0.18)" stroke-width="8"/>
        <g clip-path="url(#clip)"><path d="M300 545 C 372 502 444 506 512 545 S 652 586 724 540 V 800 H 300 Z" fill="url(#jam)"/></g>
        <rect x="296" y="326" width="432" height="472" rx="110" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.55" stroke-width="14"/>
        <rect x="360" y="236" width="304" height="100" rx="34" fill="#f2eff6"/>
      </svg>
      Nimbrung
    </div>
    <p class="line">Everyone picks the music.</p>
    <p class="sub">A self-hosted jam for YouTube Music.<br>Guests scan a QR code and add songs from their phones.</p>
  </div>
  <div class="phone">
    <div class="ambient"></div>
    <div class="in">
      <div class="head">Rina’s rooftop <span class="tag">SORE</span></div>
      <div class="art art-senja artw"></div>
      <div><div class="t">Senja di Kemang</div><div class="a">Laut Biru</div></div>
      <div class="reacts"><span>🔥</span><span>❤️</span><span>😂</span><span>👏</span><span>💃</span><span>🎉</span></div>
      <div class="rows">
        <div class="r"><div class="art art-lampu thumb"></div><div><b>Lampu Kota</b><small>Orkes Malam · 🐸 Sari</small></div></div>
        <div class="r"><div class="art art-kopi thumb"></div><div><b>Kopi Pagi</b><small>Teman Sebangku · 🐼 Bima</small></div></div>
      </div>
    </div>
  </div>
  <div class="chip c1">🔥<span>Bima</span></div>
  <div class="chip c2">❤️<span>Sari</span></div>
</div>
</body>
</html>
