<div class="nb dark-glass" style="width: 390px; height: 844px">

<main class="layer" style="position: absolute; left: 28px; right: 28px; top: 244px; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 120px; text-align: center">

</div>
<h2 class="t-title">Nothing saved yet</h2>
<p class="t-body t-2" style="max-width: 290px; text-wrap: pretty">Tap the heart on a song to keep it here. The list stays on this phone, for the next jam too.</p>
<a href="Search.dc.html" class="glass-btn is-capsule is-primary" style="height: 50px; margin-top: 8px; padding: 0 24px; gap: 8px; font-size: 16px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Search songs</a>
</main>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px">
<a href="Main.dc.html" class="glass-btn is-capsule glass-rim" style="height: 44px; padding: 0 16px 0 10px; gap: 4px; font-size: 15px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Queue</a>
<p role="status" class="t-sm t-2"><span class="num">3</span> adds left this minute</p>
</div>
<h1 class="t-large" style="padding-left: 4px">Add a song</h1>

<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" name="q" aria-label="Search your saved songs" placeholder="Search your saved songs" autocomplete="off" enterkeyhint="search">
</div>
<div class="chips" role="group" aria-label="Search in">
<button class="glass-btn is-capsule glass-rim" aria-pressed="false">Songs</button>
<button class="glass-btn is-capsule glass-rim" aria-pressed="false">Videos</button>
<button class="glass-btn is-capsule glass-rim" aria-pressed="false">Playlists</button>
<button class="glass-btn is-capsule glass-rim" aria-pressed="true"><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="M20 6 9 17l-5-5"></path></svg>Saved</button>
